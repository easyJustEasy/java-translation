<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="baidu_union_verify" content="bb623f7a89c5a39d1b1db464670c2a8a">
    <title>翻译器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            padding: 24px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sub {
            color: #4a6a85;
            margin-bottom: 24px;
            border-left: 4px solid #3b82f6;
            padding-left: 12px;
        }
        .lang-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            align-items: flex-end;
        }
        .lang-box {
            flex: 1;
            min-width: 150px;
        }
        label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #1e293b;
            display: block;
            margin-bottom: 6px;
        }
        select, button {
            padding: 10px 14px;
            border-radius: 60px;
            border: 1px solid #cbd5e1;
            background: white;
            font-size: 0.9rem;
            cursor: pointer;
        }
        select {
            width: 100%;
        }
        .swap-btn {
            background: #eef2ff;
            border: none;
            padding: 10px 18px;
            font-size: 1.2rem;
        }
        .panels {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 24px;
        }
        .panel {
            flex: 1;
            background: #fafcff;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        .panel-header {
            padding: 14px 20px;
            background: #f8fafc;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
        }
        textarea {
            width: 100%;
            min-height: 220px;
            padding: 16px 20px;
            border: none;
            font-family: monospace;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            background: white;
        }
        textarea[readonly] {
            background: #fefce8;
        }
        .actions {
            padding: 12px 20px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-icon {
            background: #f1f5f9;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }
        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 24px;
            color: #5b6e8c;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📋 私有翻译</h1>

    <div class="lang-bar">
        <div class="lang-box">
            <label>源语言</label>
            <select id="sourceLang">
                <option value="英语">英语</option>
                <option value="中文" selected>中文</option>
                <option value="日语">日语</option>
                <option value="韩语">韩语</option>
                <option value="法语">法语</option>
                <option value="德语">德语</option>
                <option value="西班牙语">西班牙语</option>
            </select>
        </div>
        <button id="swapBtn" class="swap-btn">⇄ 互换</button>
        <div class="lang-box">
            <label>目标语言</label>
            <select id="targetLang">
                <option value="英语" selected>英语</option>
                <option value="中文" >中文</option>
                <option value="日语">日语</option>
                <option value="韩语">韩语</option>
                <option value="法语">法语</option>
                <option value="德语">德语</option>
                <option value="西班牙语">西班牙语</option>
            </select>
        </div>
    </div>

    <div class="panels">
        <div class="panel">
            <div class="panel-header">
                <span>📝 原文</span>
                <span id="inputCounter">0 字符</span>
            </div>
            <textarea id="inputText" placeholder="输入要翻译的文本..."></textarea>
            <div class="actions">
                <button id="clearBtn" class="btn-icon">🧹 清空</button>
                <button id="speakSrcBtn" class="btn-icon">🔊 朗读原文</button>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">
                <span>✨ 译文</span>
                <span id="outputCounter">0 字符</span>
            </div>
            <textarea id="outputText" readonly placeholder="翻译结果将显示在这里..."></textarea>
            <div class="actions">
                <button id="copyBtn" class="btn-icon">📋 复制译文</button>
                <button id="speakTgtBtn" class="btn-icon">🔊 朗读译文</button>
            </div>
        </div>
    </div>

    <div style="display: flex; justify-content: center; gap: 16px;">
        <button id="translateBtn" class="btn-primary">🚀 立即翻译</button>
    </div>
</div>
<div id="toast" class="toast">✅ 已复制</div>

<script>
    // ========== 配置你的接口地址 ==========
    const API_BASE_URL = "/api/translate";   // 后端POST接口地址

    // DOM 元素
    const sourceLangSelect = document.getElementById('sourceLang');
    const targetLangSelect = document.getElementById('targetLang');
    const inputTextarea = document.getElementById('inputText');
    const outputTextarea = document.getElementById('outputText');
    const translateBtn = document.getElementById('translateBtn');
    const swapBtn = document.getElementById('swapBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const speakSrcBtn = document.getElementById('speakSrcBtn');
    const speakTgtBtn = document.getElementById('speakTgtBtn');
    const inputCounter = document.getElementById('inputCounter');
    const outputCounter = document.getElementById('outputCounter');
    const toast = document.getElementById('toast');

    function showMessage(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function updateCounters() {
        inputCounter.innerText = inputTextarea.value.length + ' 字符';
        outputCounter.innerText = outputTextarea.value.length + ' 字符';
    }

    // 调用你的接口进行翻译 (POST 表单提交)
    async function translateText() {
        const text = inputTextarea.value.trim();
        if (!text) {
            showMessage("请输入要翻译的文本");
            return;
        }
        const source = sourceLangSelect.value;
        const target = targetLangSelect.value;

        // 显示加载状态
        translateBtn.disabled = true;
        translateBtn.innerHTML = "⏳ 翻译中...";

        try {
            // 构建 POST 表单数据 (application/x-www-form-urlencoded)
            const formData = new URLSearchParams();
            formData.append('text', text);
            formData.append('sourceLanguage', source);
            formData.append('targetLanguage', target);

            const response = await fetch(API_BASE_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: formData.toString()
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            // 处理响应（根据后端实际返回格式调整）
            const contentType = response.headers.get("content-type");
            let translated = "";
            if (contentType && contentType.includes("application/json")) {
                const data = await response.json();
                // 假设返回的 JSON 包含 translation 字段，根据实际情况修改
                translated = data.translation || data.data || data.result || JSON.stringify(data);
            } else {
                translated = await response.text();
            }
            outputTextarea.value = translated;
            updateCounters();
            showMessage("翻译完成");
        } catch (error) {
            console.error(error);
            outputTextarea.value = "❌ 翻译请求失败: " + error.message;
            showMessage("接口调用失败");
        } finally {
            translateBtn.disabled = false;
            translateBtn.innerHTML = "🚀 立即翻译";
        }
    }

    // 互换语言和文本
    function swapLanguages() {
        const srcLang = sourceLangSelect.value;
        const tgtLang = targetLangSelect.value;
        sourceLangSelect.value = tgtLang;
        targetLangSelect.value = srcLang;
        // 互换文本框内容
        const srcText = inputTextarea.value;
        const tgtText = outputTextarea.value;
        inputTextarea.value = tgtText;
        outputTextarea.value = "";
        updateCounters();
        showMessage("已互换语言");
        if (inputTextarea.value.trim()) {
            translateText();
        }
    }

    function clearInput() {
        inputTextarea.value = "";
        outputTextarea.value = "";
        updateCounters();
        showMessage("已清空");
    }

    async function copyOutput() {
        const text = outputTextarea.value;
        if (!text) {
            showMessage("没有译文可复制");
            return;
        }
        try {
            await navigator.clipboard.writeText(text);
            showMessage("✅ 译文已复制");
        } catch (err) {
            showMessage("复制失败");
        }
    }
    // ---------- 朗读功能（Chrome 兼容修复版） ----------
    // 修复要点（Chrome speechSynthesis 已知坑）：
    // 1. 不用 dummy 解锁：首次点击时直接 speak 就是有效用户手势，dummy 反而
    //    在 cancel 时污染引擎状态，导致紧接着的正文被 interrupted
    // 2. speak 前 resume() 唤醒：Chrome 长时间不用 speechSynthesis 会"卡死"，
    //    之后 speak 立即报 interrupted/not-allowed，resume 可唤醒
    // 3. 不在 cancel 后 setTimeout speak：Chrome 取消后立刻 speak 新 utterance
    //    是已知竞态，直接 speak 交给引擎内部队列更稳
    // 4. getVoices 首次可能为空：监听 voiceschanged 预加载
    // 5. 非主动的 interrupted 自动重试一次（Chrome 偶发）
    let currentUtterance = null;
    let retriedSpeak = false;   // 是否已自动重试过
    let userRequested = false;  // 用户是否刚点了新朗读（旧 utterance 中断属预期）
    const langMap = {
        "英语": "en",
        "中文": "zh-CN",
        "日语": "ja",
        "韩语": "ko",
        "法语": "fr",
        "德语": "de",
        "西班牙语": "es"
    };

    // 预加载语音列表（Chrome 首次 getVoices 可能为空，等 voiceschanged）
    if (window.speechSynthesis) {
        window.speechSynthesis.addEventListener('voiceschanged', function () {
            window.__voicesReady = true;
        });
    }

    function speakText(text, lang) {
        if (!text || text.trim() === "") {
            showMessage("没有文本可朗读");
            return;
        }

        const langCode = langMap[lang] || "zh-CN";

        // 停止当前正在播放的语音（同步 API）
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
            // Chrome 卡死唤醒
            window.speechSynthesis.resume();
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = langCode;
        utterance.rate = 0.9;   // 稍慢，更清晰
        utterance.pitch = 1.0;
        utterance.volume = 1;

        // 匹配最佳语音（voices 可能尚未就绪，就绪后 speak 会自动用默认语音）
        try {
            const voices = window.speechSynthesis.getVoices();
            const matchedVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(langCode.split('-')[0].toLowerCase()));
            if (matchedVoice) {
                utterance.voice = matchedVoice;
            }
        } catch (e) { /* 忽略 */ }

        utterance.onerror = (event) => {
            currentUtterance = null;
            if (event.error === 'interrupted' || event.error === 'canceled') {
                // 用户主动点了新朗读 → 新 utterance 已接管，静默
                if (userRequested) {
                    return;
                }
                // 非主动中断：Chrome 偶发，自动重试一次
                if (!retriedSpeak) {
                    retriedSpeak = true;
                    console.log("语音被中断，自动重试一次");
                    setTimeout(function () { speakText(text, lang); }, 300);
                }
                return;
            }
            console.error("语音播放出错", event);
            showMessage("朗读失败: " + event.error);
        };

        utterance.onend = () => {
            currentUtterance = null;
            retriedSpeak = false;
        };

        currentUtterance = utterance;
        retriedSpeak = false;
        window.speechSynthesis.speak(utterance);
    }

    // 朗读原文/译文（用户手势内直接调用，无需 dummy 解锁）
    function speakSource() {
        userRequested = true;
        speakText(inputTextarea.value, sourceLangSelect.value);
    }
    function speakTarget() {
        userRequested = true;
        speakText(outputTextarea.value, targetLangSelect.value);
    }

    // 事件绑定
    inputTextarea.addEventListener('input', updateCounters);
    translateBtn.addEventListener('click', translateText);
    swapBtn.addEventListener('click', swapLanguages);
    clearBtn.addEventListener('click', clearInput);
    copyBtn.addEventListener('click', copyOutput);
    speakSrcBtn.addEventListener('click', speakSource);
    speakTgtBtn.addEventListener('click', speakTarget);

    sourceLangSelect.addEventListener('change', () => { if (inputTextarea.value.trim()) translateText(); });
    targetLangSelect.addEventListener('change', () => { if (inputTextarea.value.trim()) translateText(); });

    // 示例默认文本
    inputTextarea.value = "为中华崛起而读书，实现中华民族伟大复兴";
    updateCounters();
    // 首次自动翻译（可选，如果需要启用则去掉注释）
    // translateText();
</script>
</body>
</html>
